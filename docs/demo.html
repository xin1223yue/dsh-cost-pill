<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>dsh-cost-pill — render preview</title>
<style>
  :root {
    --dsw-specific-menu: #ffffff;
    --dsw-alias-label-primary: #17181a;
    --dsw-alias-label-secondary: #4d5057;
    --dsw-alias-label-tertiary: #8b8f98;
    --dsw-alias-border-l1: rgba(0, 0, 0, .10);
    --dsw-alias-border-l2: rgba(0, 0, 0, .07);
    --dsw-alias-separator-primary: rgba(0, 0, 0, .09);
    --dsw-alias-interactive-bg-hover: rgba(0, 0, 0, .045);
    --dsw-radius-sm: 6px;
    --dsw-radius-lg: 12px;
    --dsw-elevation-prominent: 0 10px 30px rgba(15, 20, 40, .16), 0 2px 6px rgba(15, 20, 40, .06);
    --dsw-menu-backdrop-filter: blur(20px) saturate(180%);
    --dsh-content-font-size-secondary: 13px;
    --dsh-content-font-delta-secondary: 0px;
  }
  html, body { margin: 0; background: #f4f5f7; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--dsw-alias-label-primary);
  }
  .stage { position: relative; width: 980px; height: 470px; padding: 24px 26px; box-sizing: border-box; }

  /* --- simplified dsh composer, for context ---------------------------- */
  .composer {
    background: #fff;
    border: 1px solid var(--dsw-alias-border-l1);
    border-radius: 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 10px 26px rgba(0,0,0,.05);
    padding: 20px 20px 10px;
  }
  .composer .line { color: #9aa0aa; font-size: 14px; line-height: 22px; }
  .composer .toolbar {
    display: flex; align-items: center; gap: 8px; margin-top: 16px;
    color: #6b7078; font-size: 13px;
  }
  .chip { border: 1px solid var(--dsw-alias-border-l1); border-radius: 8px; padding: 3px 9px; color: #4d5057; background: #fff; }
  .toolbar .grow { flex: 1; }
  .send { width: 30px; height: 30px; border-radius: 9px; background: #eef0f3; display: grid; place-items: center; color: #7b8088; }

  /* --- the shipped stats row (same metrics as ui-chat) ----------------- */
  .dock {
    display: flex; align-items: center; gap: 12px; justify-content: center;
    padding-top: 12px; font-size: 12px; line-height: 20px; color: var(--dsw-alias-label-tertiary);
  }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 1px 8px; }
  .pill svg { width: 14px; height: 14px; flex: none; }
  .sep { color: var(--dsw-alias-separator-primary); margin: 0 6px; }
  .ring { width: 16px; height: 16px; border-radius: 50%; background: conic-gradient(#c9ccd2 0 18%, #e6e8ec 18% 100%); display: inline-block; }

  /* --- the plugin's own stylesheet (copied from client.js) ------------- */
  .dcp-anchor { min-width: 0; font-size: calc(var(--dsh-content-font-size-secondary, 13px) - 1px); line-height: calc(20px + var(--dsh-content-font-delta-secondary, 0px)); display: inline-flex; }
  .dcp-pill { box-sizing: border-box; border-radius: var(--dsw-radius-sm); max-width: 100%; color: var(--dsw-alias-label-tertiary); font: inherit; font-variant-numeric: tabular-nums; line-height: inherit; white-space: nowrap; background: 0 0; border: none; align-items: center; gap: 6px; padding: 1px 8px; display: inline-flex; cursor: pointer; }
  .dcp-pill svg { flex: none; width: 14px; height: 14px; }
  .dcp-pill[aria-expanded="true"] { background: var(--dsw-alias-interactive-bg-hover); color: var(--dsw-alias-label-secondary); }
  .dcp-label { text-overflow: ellipsis; min-width: 0; overflow: hidden; }
  .dcp-turn-anchor { display: inline-flex; align-items: center; min-width: 0; }
  .dcp-turn { font: inherit; font-size: 12px; line-height: 18px; font-variant-numeric: tabular-nums; color: var(--dsw-alias-label-tertiary); background: 0 0; border: 0; border-radius: var(--dsw-radius-sm); padding: 1px 6px; margin: 0; cursor: pointer; white-space: nowrap; }
  .dcp-panel { position: absolute; z-index: 1100; box-sizing: border-box; width: max-content; min-width: 268px; max-width: 340px; padding: 14px 16px 13px; border-radius: var(--dsw-radius-lg); border: 0; cursor: default; background: var(--dsw-specific-menu); backdrop-filter: var(--dsw-menu-backdrop-filter); -webkit-backdrop-filter: var(--dsw-menu-backdrop-filter); --dsw-elevation-stroke-color: var(--dsw-alias-border-l1); box-shadow: var(--dsw-elevation-prominent); color: var(--dsw-alias-label-secondary); font-size: 12px; line-height: 18px; font-variant-numeric: tabular-nums; font-family: inherit; }
  .dcp-title { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; color: var(--dsw-alias-label-primary); font-weight: 500; margin-bottom: 8px; }
  .dcp-title-value { font-variant-numeric: tabular-nums; font-weight: 600; }
  .dcp-rule { border-top: .5px solid var(--dsw-alias-border-l2); margin-bottom: 10px; }
  .dcp-details { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; margin: 0; color: var(--dsw-alias-label-tertiary); }
  .dcp-details dt, .dcp-details dd { min-width: 0; margin: 0; }
  .dcp-details dd { color: var(--dsw-alias-label-secondary); text-align: right; white-space: nowrap; }
  .dcp-foot { margin-top: 10px; padding-top: 9px; border-top: .5px solid var(--dsw-alias-border-l2); color: var(--dsw-alias-label-tertiary); font-size: 11px; line-height: 17px; }
  .dcp-foot em { font-style: normal; color: var(--dsw-alias-label-secondary); }

  /* --- per-turn footer row --------------------------------------------- */
  .turn { display: flex; align-items: center; gap: 8px; height: 28px; color: var(--dsw-alias-label-tertiary); font-size: 13px; }
  .turn .ico { width: 16px; height: 16px; flex: none; color: #a8adb6; }
  .turn .end { margin-left: 8px; display: inline-flex; align-items: center; gap: 8px; color: var(--dsw-alias-label-tertiary); }
  .turn .clock { font-size: 12px; }
</style>
</head>
<body>

<!-- figure 1: composer stats line + open bill -->
<div class="stage">
  <div class="composer">
    <div class="line">把这次会话的账单显示在底部，每一轮也能看到花了多少。</div>
    <div class="toolbar">
      <span class="chip">deepseek-flash</span>
      <span class="chip">Max</span>
      <span class="grow"></span>
      <span class="send">↑</span>
    </div>
    <div class="dock">
      <span class="pill">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8 4.6v3.2l2.2 1.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        <span>2 轮 33 步<span class="sep">·</span>219 tok/s</span>
      </span>
      <span class="pill">
        <svg viewBox="0 0 16 16" aria-hidden="true"><ellipse cx="8" cy="3.9" rx="5.2" ry="2.1" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M2.8 3.9v4.1c0 1.16 2.33 2.1 5.2 2.1s5.2-.94 5.2-2.1V3.9M2.8 8v4.1c0 1.16 2.33 2.1 5.2 2.1s5.2-.94 5.2-2.1V8" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
        <span>1.4M tok<span class="sep">·</span>缓存命中 98%</span>
      </span>
      <span class="dcp-anchor">
        <button class="dcp-pill" aria-expanded="true">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.4" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M5.3 5.2 8 8.4l2.7-3.2M8 8.4v3.1M6.1 9.1h3.8M6.1 10.7h3.8" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="dcp-label">¥2.15</span>
        </button>
      </span>
      <span class="pill"><span class="ring"></span><span>18%</span></span>
    </div>
  </div>

  <div class="dcp-panel" style="left: 26px; bottom: 96px;">
    <div class="dcp-title">
      <span>本次对话花费</span>
      <span class="dcp-title-value">¥2.15</span>
    </div>
    <div class="dcp-rule"></div>
    <dl class="dcp-details">
      <dt>输入（未命中 + 缓存写入）</dt><dd>11.8万 · ¥0.35</dd>
      <dt>缓存命中</dt><dd>1174.8万 · ¥1.17</dd>
      <dt>输出</dt><dd>6.9万 · ¥0.62</dd>
    </dl>
    <div class="dcp-foot">
      <div>已计价 2 轮 · 合计 1193.5万 tokens</div>
      <div>当前时段高峰（09:00–12:00 / 14:00–18:00 为高峰，北京时间）</div>
      <div>每条回复按它发生时刻的价格计价，高峰 / 空闲自动切换</div>
    </div>
  </div>
</div>

</body>
</html>
