<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>sidebar foot — balance v4</title>
<style>
  :root {
    --dsw-alias-label-primary: #17181a;
    --dsw-alias-label-secondary: #4d5057;
    --dsw-alias-label-tertiary: #8b8f98;
    --dsw-alias-border-l1: rgba(0,0,0,.10);
    --dsw-alias-interactive-bg-hover: rgba(0,0,0,.045);
    --dsw-radius-sm: 6px;
  }
  html, body { margin: 0; background: #f4f5f7; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; }
  .wrap { padding: 26px 28px; display: flex; gap: 26px; align-items: flex-start; }
  .panel { width: 240px; background: #fff; border: 1px solid var(--dsw-alias-border-l1); border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.05); padding: 14px 12px 10px; box-sizing: border-box; }
  .cap { font-size: 11px; color: #9aa0aa; margin: 0 0 8px 4px; letter-spacing: .02em; }

  .sess { height: 9px; border-radius: 4px; background: #eef0f3; margin: 0 4px 10px; }
  .sess.short { width: 58%; }
  .grow { height: 78px; }

  .foot { display: flex; flex-direction: column; gap: 2px; }
  .foot .row { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; }
  .gear { width: 18px; height: 18px; color: #9aa0aa; }
  .avatar { width: 26px; height: 26px; border-radius: 50%; background: #b48c47; color: #fff; font-size: 11px; font-weight: 600; display: grid; place-items: center; }
  .name { font-size: 13px; color: var(--dsw-alias-label-primary); }

  /* plugin classes */
  .dcp-bal { box-sizing: border-box; width: 100%; height: 28px; padding: 0 6px; margin: 0; border: 0; border-radius: var(--dsw-radius-sm); background: 0 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; font: inherit; color: var(--dsw-alias-label-secondary); cursor: default; white-space: nowrap; }
  .dcp-bal-label { color: var(--dsw-alias-label-tertiary); font-size: 11px; line-height: 1; letter-spacing: .04em; }
  .dcp-bal-value { font-size: 12px; line-height: 1; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: .01em; color: var(--dsw-alias-label-secondary); }
  .dcp-bal-sym { color: var(--dsw-alias-label-tertiary); font-size: 11px; margin-right: 2px; }
  .dcp-bal[data-state="empty"] .dcp-bal-value { color: var(--dsw-alias-label-tertiary); font-weight: 400; }
</style>
</head>
<body>
<div class="wrap">

  <div>
    <p class="cap">正常</p>
    <div class="panel">
      <div class="sess"></div>
      <div class="sess short"></div>
      <div class="sess"></div>
      <div class="grow"></div>
      <div class="foot">
        <button class="dcp-bal" data-state="ok"><span class="dcp-bal-label">余额</span><span class="dcp-bal-value"><span class="dcp-bal-sym">¥</span>197.66</span></button>
        <div class="row">
          <svg class="gear" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="8" cy="8" r="2.1"/><path d="M8 1.9v1.6M8 12.5v1.6M1.9 8h1.6M12.5 8h1.6M3.7 3.7l1.1 1.1M11.2 11.2l1.1 1.1M12.3 3.7l-1.1 1.1M4.8 11.2l-1.1 1.1" stroke-linecap="round"/></svg>
          <span class="avatar">鑫</span>
          <span class="name">鑫钥</span>
        </div>
      </div>
    </div>
  </div>

  <div>
    <p class="cap">读不到（降级）</p>
    <div class="panel">
      <div class="sess"></div>
      <div class="sess short"></div>
      <div class="sess"></div>
      <div class="grow"></div>
      <div class="foot">
        <button class="dcp-bal" data-state="empty"><span class="dcp-bal-label">余额</span><span class="dcp-bal-value">—</span></button>
        <div class="row">
          <svg class="gear" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="8" cy="8" r="2.1"/><path d="M8 1.9v1.6M8 12.5v1.6M1.9 8h1.6M12.5 8h1.6M3.7 3.7l1.1 1.1M11.2 11.2l1.1 1.1M12.3 3.7l-1.1 1.1M4.8 11.2l-1.1 1.1" stroke-linecap="round"/></svg>
          <span class="avatar">鑫</span>
          <span class="name">鑫钥</span>
        </div>
      </div>
    </div>
  </div>

</div>
</body>
</html>
